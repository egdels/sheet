name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint & build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android platform and NDK
        run: sdkmanager --install "platforms;android-37.0" "ndk;28.0.13004108"
      - name: Build NCNN
        env:
          ABIS: arm64-v8a x86_64
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: |
          pip install --user cmake==3.31.6
          git submodule update --init external/ncnn
          NCNN_CMAKE="$HOME/.local/bin/cmake" scripts/build_ncnn.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :core:test :eval:test
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Sheet-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
