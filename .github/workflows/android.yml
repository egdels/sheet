name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test, lint & build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android platform and NDK
        run: sdkmanager --install "platforms;android-37.0" "ndk;28.0.13004108"
      - name: ONNX Runtime commit
        id: ort
        run: echo "commit=$(git rev-parse HEAD:external/onnxruntime)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: ort-cache
        with:
          path: |
            app/src/main/jniLibs
            app/libs
          key: ort-${{ steps.ort.outputs.commit }}-${{ hashFiles('ort/*.config', 'scripts/build_onnxruntime.sh', 'external/onnxruntime_pinned/*') }}
      - name: Build ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        env:
          ABIS: arm64-v8a x86_64
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: |
          sudo apt-get install -y ninja-build
          pip install flatbuffers
          git submodule update --init external/onnxruntime
          git -C external/onnxruntime submodule update --init cmake/external/onnx
          scripts/build_onnxruntime.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :core:test :eval:test
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sheet-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
