name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Verify the tag & create the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches gradle.properties
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::tag $TAG does not match appVersion=$VERSION in gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update the release (no assets yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = (index($0, "## [" v "]") == 1); next }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$NOTES"
          args=(--title "$TAG" --repo "${{ github.repository }}")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          if [[ -s "$NOTES" ]]; then
            echo "release notes: CHANGELOG.md section [$VERSION]"
          else
            echo "::warning::CHANGELOG.md has no [$VERSION] section, using generated notes"
            rm -f "$NOTES"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists - updating notes, assets will be replaced"
            if [[ -f "$NOTES" ]]; then
              gh release edit "$TAG" "${args[@]}" --notes-file "$NOTES"
            else
              gh release edit "$TAG" "${args[@]}"
            fi
          else
            if [[ -f "$NOTES" ]]; then
              args+=(--notes-file "$NOTES")
            else
              args+=(--generate-notes)
            fi
            gh release create "$TAG" "${args[@]}"
          fi

  android:
    name: Build & sign the APK and AAB
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android platform and NDK
        run: sdkmanager --install "platforms;android-37.0" "ndk;28.0.13004108"
      - name: ONNX Runtime commit
        id: ort
        run: echo "commit=$(git rev-parse HEAD:external/onnxruntime)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: ort-cache
        with:
          path: |
            app/src/main/jniLibs
            app/libs
          key: ort-all-${{ steps.ort.outputs.commit }}-${{ hashFiles('ort/*.config', 'scripts/build_onnxruntime.sh', 'external/onnxruntime_pinned/*') }}
      - name: Build ONNX Runtime (all four ABIs)
        if: steps.ort-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: |
          sudo apt-get install -y ninja-build
          pip install flatbuffers
          git submodule update --init external/onnxruntime
          git -C external/onnxruntime submodule update --init cmake/external/onnx
          scripts/build_onnxruntime.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :core:test :eval:test

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the signed release APK and AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$APK" ]]; then
            echo "::error::no signed APK (signing secrets missing?); found: $(ls app/build/outputs/apk/release)"
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if ! unzip -l "$APK" | grep -q "lib/$abi/libonnxruntime.so"; then
              echo "::error::the APK has no ONNX Runtime for $abi"
              exit 1
            fi
          done
          cp "$APK" "Sheet-${{ needs.create-release.outputs.version }}.apk"
          AAB=app/build/outputs/bundle/release/app-release.aab
          if ! unzip -l "$AAB" | grep -qE 'META-INF/[^/]+\.(RSA|EC|DSA)$'; then
            echo "::error::the AAB is not signed (signing secrets missing?)"
            exit 1
          fi
          cp "$AAB" "Sheet-${{ needs.create-release.outputs.version }}.aab"

      - name: Upload the APK and AAB to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "Sheet-${{ needs.create-release.outputs.version }}.apk" "Sheet-${{ needs.create-release.outputs.version }}.aab" --clobber --repo "${{ github.repository }}"
